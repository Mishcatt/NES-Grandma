MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;

    # INES Cartridge Header
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # 16 16K ROM Banks
    # - startup
    # - code
    # - rodata
    # - data (load)
    ROM00:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=0;
    ROM01:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=1;
    ROM02:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=2;
    ROM03:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=3;
    ROM04:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=4;
    ROM05:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=5;
    ROM06:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=6;
    ROM07:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=7;
    ROM08:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=8;
    ROM09:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=9;
    ROM10:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=10;
    ROM11:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=11;
    ROM12:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=12;
    ROM13:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=13;
    ROM14:   file = %O, start = $8000, size = $4000, fill = yes, define = yes, fillval = $ff, bank=14;
    ROM15:   file = %O, start = $C000, size = $3FFA, fill = yes, define = yes, fillval = $ff, bank=15;

    # Hardware Vectors at End of 16th 16K Bank
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;

    # standard 2k SRAM (-zeropage)
    # $0100-$0200 CPU Stack
    # $0200-$0300 OAM DMA
    # $0300-$0800 RAM
    OAM:   file = "", start = $0200, size = $0100, type = rw;
    RAM:   file = "", start = $0300, size = $0500, define = yes;
}
SEGMENTS {
    HEADER:   load = HEADER,           type = ro,  align    = $10;
    ZEROPAGE: load = ZP,               type = zp;
    BSS:      load = RAM,              type = bss, define   = yes;

    BANK00:   load = ROM00,            type = ro,  define   = yes;
    BANK01:   load = ROM01,            type = ro,  define   = yes;
    BANK02:   load = ROM02,            type = ro,  define   = yes;
    BANK03:   load = ROM03,            type = ro,  define   = yes;
    BANK04:   load = ROM04,            type = ro,  define   = yes;
    BANK05:   load = ROM05,            type = ro,  define   = yes;
    BANK06:   load = ROM06,            type = ro,  define   = yes;
    BANK07:   load = ROM07,            type = ro,  define   = yes;
    BANK08:   load = ROM08,            type = ro,  define   = yes;
    BANK09:   load = ROM09,            type = ro,  define   = yes;
    BANK10:   load = ROM10,            type = ro,  define   = yes;
    BANK11:   load = ROM11,            type = ro,  define   = yes;
    BANK12:   load = ROM12,            type = ro,  define   = yes;
    BANK13:   load = ROM13,            type = ro,  define   = yes;
    BANK14:   load = ROM14,            type = ro,  define   = yes;

    CODE:     load = ROM15,            type = ro,  define   = yes;
    RODATA:   load = ROM15,            type = ro,  define   = yes;
    DATA:     load = ROM15, run = RAM, type = ro,  define   = yes;
    VECTORS:  load = ROMV,             type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
